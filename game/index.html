<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>Silent Ledger</title>
<style>
  html,body{margin:0;padding:0;background:#0b1020;height:100%;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;font-family:Verdana,Geneva,sans-serif;}
  #stage{position:relative;width:960px;height:480px;}
  canvas{display:block;background:#16223d;width:960px;height:480px;}
  #hud{position:absolute;top:0;left:0;right:0;height:26px;background:rgba(11,16,32,.82);
       display:flex;align-items:center;justify-content:space-between;
       padding:0 12px;box-sizing:border-box;color:#e7edf7;font-size:13px;z-index:5;}
  #status{white-space:nowrap;overflow:hidden;}
  #right{display:flex;align-items:center;gap:16px;white-space:nowrap;}
  #counters{font-size:12px;color:#b9c4d8;}
  #restart{background:#2c3d66;border:1px solid #4b5f8a;color:#e7edf7;font-size:12px;
           cursor:pointer;padding:3px 10px;border-radius:4px;}
  #restart:hover{background:#3a4f80;}
  #hint{position:absolute;left:0;right:0;bottom:0;height:24px;background:rgba(11,16,32,.78);
        display:flex;align-items:center;padding:0 12px;box-sizing:border-box;
        color:#93a2bb;font-size:12px;z-index:5;}
  #band{position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(11,16,32,.55);
        display:none;align-items:center;justify-content:center;z-index:10;cursor:pointer;}
  #band span{font-size:42px;font-weight:bold;color:#1fbf6b;letter-spacing:2px;text-align:center;line-height:1.25;}
</style>
</head>
<body>
<div id="stage">
  <div id="hud">
    <div id="status">Level 1 of 2 — Reach the green exit. 3 guards, cones reach 3 tiles. Hide behind crates.</div>
    <div id="right">
      <div id="counters">Moves 0 &middot; Seen 0</div>
      <button id="restart">Restart</button>
    </div>
  </div>
  <canvas id="cv" width="960" height="480"></canvas>
  <div id="hint">Arrow keys / WASD to move tile by tile. Guards patrol; if a guard's cone touches you and no crate blocks the view, you are spotted.</div>
  <div id="band"><span id="bandtext"></span></div>
</div>
<script>
"use strict";
(function(){
  var TILE=48, COLS=20, ROWS=10;
  var LEVELS=[
    {
      map:[
        "####################",
        "#...C..#.......#...#",
        "#..C...#...C...#.#E#",
        "#......#.......#...#",
        "#..##.....##.......#",
        "#......C......##...#",
        "#..#.......#.......#",
        "#..#...C...#...##..#",
        "#P.....#.......#...#",
        "####################"
      ],
      start:{x:1,y:8}, exit:{x:18,y:2}, coneRange:3,
      guards:[
        {wp:[[5,1],[9,1],[9,3],[5,3]],start:[5,1]},
        {wp:[[14,4],[14,7],[17,7],[17,4]],start:[14,4]},
        {wp:[[11,8],[15,8],[15,6],[11,6]],start:[11,8]}
      ]
    },
    {
      map:[
        "####################",
        "#......######......#",
        "#.CC...######..CC..#",
        "#......######......#",
        "#..##..........#..C#",
        "#..C....#..#.......#",
        "#......######......#",
        "#.CC...######..CC..#",
        "#P.....######...E..#",
        "####################"
      ],
      start:{x:1,y:8}, exit:{x:16,y:8}, coneRange:3,
      guards:[
        {wp:[[1,1],[6,1],[6,3],[1,3]],start:[1,1]},
        {wp:[[13,1],[18,1],[18,3],[13,3]],start:[13,1]},
        {wp:[[13,6],[18,6],[18,8],[13,8]],start:[13,6]},
        {wp:[[1,6],[6,6],[6,8],[1,8]],start:[6,6]}
      ]
    }
  ];
  var grid=[], LEVEL=0, CONE_RANGE=3, EXIT={x:18,y:2};
  var START={x:1,y:8}, player={x:1,y:8};
  var moves=0, seen=0, won=false, noSpot=false, levelClear=false, shotMode=false;
  var spottedAt=null, frame=0;
  var guards=[];

  function loadLevel(i){
    LEVEL=i;
    var L=LEVELS[i];
    grid=[];
    for(var r=0;r<ROWS;r++){grid.push([]);for(var c=0;c<COLS;c++){grid[r].push(L.map[r][c]);}}
    START=L.start; EXIT=L.exit; CONE_RANGE=L.coneRange;
    player={x:START.x,y:START.y};
    initGuards();
  }
  function initGuards(){
    guards=[];
    var defs=LEVELS[LEVEL].guards;
    for(var i=0;i<defs.length;i++){
      var d=defs[i];
      var dir=[1,0];
      if(d.wp[0][0]===d.wp[1][0]){dir=[0,1];}
      guards.push({x:d.start[0],y:d.start[1],wp:d.wp,wpIdx:0,dir:dir});
    }
  }
  function guardFacing(g){
    var nxt=g.wp[(g.wpIdx+1)%g.wp.length];
    var dx=nxt[0]-g.x, dy=nxt[1]-g.y;
    if(dx>0)return[1,0];
    if(dx<0)return[-1,0];
    if(dy>0)return[0,1];
    if(dy<0)return[0,-1];
    return g.dir;
  }
  function solid(cx,cy){
    if(cx<0||cx>=COLS||cy<0||cy>=ROWS)return true;
    var ch=grid[cy][cx];
    return ch==='#'||ch==='C';
  }
  function losBlocked(gx,gy,tx,ty){
    var x0=gx*TILE+TILE/2, y0=gy*TILE+TILE/2;
    var x1=tx*TILE+TILE/2, y1=ty*TILE+TILE/2;
    var dx=x1-x0, dy=y1-y0;
    var steps=Math.max(Math.abs(dx),Math.abs(dy));
    if(steps===0)return false;
    var incX=dx/steps, incY=dy/steps;
    var cx=x0, cy=y0;
    var lastIdx=-1;
    for(var s=1;s<steps;s++){
      cx=x0+incX*s; cy=y0+incY*s;
      var cc=Math.floor(cx/TILE), cr=Math.floor(cy/TILE);
      var idx=cr*COLS+cc;
      if(idx!==lastIdx){
        lastIdx=idx;
        if(cc===gx&&cr===gy)continue;
        var ch=grid[cr]?grid[cr][cc]:'#';
        if(ch==='#'||ch==='C')return true;
      }
    }
    return false;
  }
  function inCone(g,tx,ty){
    var ox=tx-g.x, oy=ty-g.y;
    var d=Math.abs(ox)+Math.abs(oy);
    if(d<1||d>CONE_RANGE)return false;
    var f=guardFacing(g);
    var dot=ox*f[0]+oy*f[1];
    if(dot<=0)return false;
    var cross=ox*f[1]-oy*f[0];
    if(Math.abs(cross)>d-1)return false;
    if(losBlocked(g.x,g.y,tx,ty))return false;
    return true;
  }
  function playerSpotted(){
    for(var i=0;i<guards.length;i++){
      if(inCone(guards[i],player.x,player.y))return true;
    }
    return false;
  }
  function movePlayer(dx,dy){
    if(won||levelClear)return;
    var nx=player.x+dx, ny=player.y+dy;
    if(solid(nx,ny))return;
    player.x=nx; player.y=ny;
    moves++;
    stepGuards();
    if(player.x===EXIT.x&&player.y===EXIT.y){enterExit();return;}
    if(!noSpot&&playerSpotted()){
      seen++;
      spottedAt={x:player.x,y:player.y};
      setStatus("Spotted! Back to the start.");
      player.x=START.x; player.y=START.y;
    } else {
      spottedAt=null;
      setStatus(defaultStatus());
    }
    refresh();
  }
  function stepGuards(){
    for(var i=0;i<guards.length;i++){
      var g=guards[i];
      var nxt=g.wp[(g.wpIdx+1)%g.wp.length];
      if(g.x===nxt[0]&&g.y===nxt[1]){
        g.wpIdx=(g.wpIdx+1)%g.wp.length;
        nxt=g.wp[(g.wpIdx+1)%g.wp.length];
      }
      var dx=nxt[0]-g.x, dy=nxt[1]-g.y;
      if(dx>0)g.dir=[1,0];
      else if(dx<0)g.dir=[-1,0];
      else if(dy>0)g.dir=[0,1];
      else if(dy<0)g.dir=[0,-1];
      if(dx!==0||dy!==0){ g.x+=Math.sign(dx); g.y+=Math.sign(dy); }
      g.dir=guardFacing(g);
    }
  }
  function enterExit(){
    if(shotMode){
      if(LEVEL===0){ loadLevel(1); setStatus(defaultStatus()); refresh(); return; }
      won=true;
      var grade=gradeRun();
      var label=(grade==="GHOST"||grade==="UNSEEN")?"UNSEEN. YOU ESCAPED — GRADE: "+grade:"YOU ESCAPED — GRADE: "+grade;
      showBand(label);
      refresh();
      return;
    }
    if(LEVEL===0){
      levelClear=true;
      setStatus("Level 1 clear. Press Space for Level 2.");
      showBand("LEVEL 1 CLEAR — SPACE FOR LEVEL 2");
      refresh();
      return;
    }
    won=true;
    var grade=gradeRun();
    var label=(grade==="GHOST"||grade==="UNSEEN")?"UNSEEN. YOU ESCAPED — GRADE: "+grade:"YOU ESCAPED — GRADE: "+grade;
    showBand(label);
    refresh();
  }
  function gradeRun(){
    if(seen===0&&moves<=60)return"GHOST";
    if(seen===0)return"UNSEEN";
    if(seen<=2)return"SHADOW";
    return"DETECTED BUT OUT";
  }
  function advanceToLevel2(){
    if(LEVEL===1)return;
    levelClear=false;
    loadLevel(1);
    hideBand();
    setStatus(defaultStatus());
    refresh();
  }
  function showBand(t){
    document.getElementById("bandtext").textContent=t;
    document.getElementById("band").style.display="flex";
  }
  function hideBand(){
    document.getElementById("band").style.display="none";
  }
  function setStatus(s){document.getElementById("status").textContent=s;}
  function defaultStatus(){
    return "Level "+(LEVEL+1)+" of 2 — Reach the green exit. "+guards.length+" guards, cones reach "+CONE_RANGE+" tiles. Hide behind crates.";
  }
  function updateCounters(){document.getElementById("counters").textContent="Moves "+moves+" \u00b7 Seen "+seen;}
  function restart(){
    levelClear=false; won=false; noSpot=false; shotMode=false; spottedAt=null; frame=0;
    moves=0; seen=0;
    loadLevel(0);
    hideBand();
    setStatus(defaultStatus());
    refresh();
  }
  var cv=document.getElementById("cv");
  var ctx=cv.getContext("2d");

  function draw(){
    frame++;
    ctx.clearRect(0,0,cv.width,cv.height);
    for(var r=0;r<ROWS;r++){
      for(var c=0;c<COLS;c++){
        var x=c*TILE, y=r*TILE;
        var ch=grid[r][c];
        if(ch==='#'){
          ctx.fillStyle="#2c3d66"; ctx.fillRect(x,y,TILE,TILE);
          ctx.strokeStyle="#232f4e"; ctx.lineWidth=2; ctx.strokeRect(x+2,y+2,TILE-4,TILE-4);
        } else {
          ctx.fillStyle="#16223d"; ctx.fillRect(x,y,TILE,TILE);
          ctx.strokeStyle="#131d36"; ctx.lineWidth=1; ctx.strokeRect(x,y,TILE,TILE);
        }
        if(ch==='C'){
          ctx.fillStyle="#7a5a2e"; ctx.fillRect(x+5,y+5,TILE-10,TILE-10);
          ctx.strokeStyle="#5c421f"; ctx.lineWidth=2; ctx.strokeRect(x+5,y+5,TILE-10,TILE-10);
        }
        if(ch==='E'){
          var s=14;
          var bright=(frame&1)?"#33d97f":"#1fbf6b";
          ctx.fillStyle=bright; ctx.fillRect(x+(TILE-s)/2,y+(TILE-s)/2,s,s);
          ctx.strokeStyle="#16a05a"; ctx.lineWidth=2; ctx.strokeRect(x+(TILE-s)/2,y+(TILE-s)/2,s,s);
        }
      }
    }
    for(var i=0;i<guards.length;i++){ drawCone(guards[i]); }
    for(var j=0;j<guards.length;j++){
      var g=guards[j];
      var cx=g.x*TILE+TILE/2, cy=g.y*TILE+TILE/2;
      ctx.fillStyle="#e5484d";
      ctx.beginPath(); ctx.arc(cx,cy,TILE*0.36,0,Math.PI*2); ctx.fill();
      var f=guardFacing(g);
      var fx=cx+f[0]*(TILE*0.22), fy=cy+f[1]*(TILE*0.22);
      ctx.fillStyle="#ffffff";
      ctx.fillRect(fx-5,fy-5,10,10);
    }
    var px=player.x*TILE+TILE/2, py=player.y*TILE+TILE/2;
    ctx.fillStyle="#39c2ff";
    ctx.beginPath(); ctx.arc(px,py,TILE*0.32,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle="#1c86b8"; ctx.lineWidth=2; ctx.stroke();
    if(spottedAt){
      var sx=spottedAt.x*TILE+TILE/2, sy=spottedAt.y*TILE+TILE/2;
      ctx.strokeStyle="#ff2d2d"; ctx.lineWidth=5;
      ctx.beginPath();
      ctx.moveTo(sx-14,sy-14); ctx.lineTo(sx+14,sy+14);
      ctx.moveTo(sx+14,sy-14); ctx.lineTo(sx-14,sy+14);
      ctx.stroke();
    }
  }
  function drawCone(g){
    var f=guardFacing(g);
    for(var r=0;r<ROWS;r++){
      for(var c=0;c<COLS;c++){
        if(inCone(g,c,r)){
          ctx.fillStyle="rgba(255,210,60,0.35)";
          ctx.fillRect(c*TILE,r*TILE,TILE,TILE);
        }
      }
    }
    for(var r2=0;r2<ROWS;r2++){
      for(var c2=0;c2<COLS;c2++){
        if(!inCone(g,c2,r2))continue;
        var rim=false;
        for(var dy=-1;dy<=1&&!rim;dy++){
          for(var dx=-1;dx<=1;dx++){
            var ncx=c2+dx, nry=r2+dy;
            if(ncx===c2&&nry===r2)continue;
            if(!inCone(g,ncx,nry)){rim=true;break;}
          }
        }
        if(rim){
          ctx.fillStyle="rgba(255,225,110,0.55)";
          ctx.fillRect(c2*TILE,r2*TILE,TILE,TILE);
        }
      }
    }
  }
  function refresh(){updateCounters();draw();}

  var keyMap={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]};
  window.addEventListener("keydown",function(e){
    var k=e.key;
    if(k===' '){
      if(levelClear){advanceToLevel2();return;}
      restart();return;
    }
    if(k==='r'||k==='R'){restart();return;}
    var m=keyMap[k];
    if(m){e.preventDefault();movePlayer(m[0],m[1]);}
  });
  document.getElementById("restart").addEventListener("click",restart);
  document.getElementById("band").addEventListener("click",function(){
    if(levelClear)advanceToLevel2();
  });

  function playSeq(seq){
    for(var i=0;i<seq.length;i++){
      var m=keyMap[seq[i]];
      movePlayer(m[0],m[1]);
    }
  }

  function buildPathToExit(){
    var q=[{x:START.x,y:START.y,path:[]}];
    var seenMap={};
    seenMap[START.y*COLS+START.x]=true;
    var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    while(q.length){
      var cur=q.shift();
      if(cur.x===EXIT.x&&cur.y===EXIT.y)return cur.path;
      for(var i=0;i<dirs.length;i++){
        var nx=cur.x+dirs[i][0], ny=cur.y+dirs[i][1];
        if(solid(nx,ny))continue;
        var key=ny*COLS+nx;
        if(seenMap[key])continue;
        seenMap[key]=true;
        q.push({x:nx,y:ny,path:cur.path.concat([[dirs[i][0],dirs[i][1]]])});
      }
    }
    return [];
  }

  var params=new URLSearchParams(location.search);
  var shot=params.get("shot");
  loadLevel(0);
  if(shot==="play"){
    playSeq(["ArrowRight","ArrowLeft","ArrowRight","ArrowUp","ArrowUp","ArrowUp","ArrowUp","ArrowUp","ArrowUp","ArrowUp","ArrowRight"]);
  } else if(shot==="spotted"){
    playSeq(["ArrowUp","ArrowUp","ArrowUp","ArrowUp","ArrowUp","ArrowRight","ArrowRight","ArrowRight"]);
  } else if(shot==="end"){
    shotMode=true;
    noSpot=true;
    var seq=buildPathToExit();
    for(var i=0;i<seq.length;i++){movePlayer(seq[i][0],seq[i][1]);}
    var seq2=buildPathToExit();
    for(var j=0;j<seq2.length;j++){movePlayer(seq2[j][0],seq2[j][1]);}
  }
  refresh();
  window.__test={get player(){return player;},get grid(){return grid;},get EXIT(){return EXIT;},get START(){return START;},get COLS(){return COLS;},get ROWS(){return ROWS;},solid:solid};
})();
</script>
</body>
</html>
